name: Continuous Integration - Delivery

on:
  push:
    branches: [ main ]
    tags: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Build and write deployment version
      if: github.ref_type != 'tag'
      working-directory: ${{ github.workspace }}/src/themes/
      run: dotnet build ./themes.csproj -c Release

    - name: Build and write tag version
      if: github.ref_type == 'tag'
      working-directory: ${{ github.workspace }}/src/themes/
      run: dotnet build ./themes.csproj -c Release /p:ThemeVersion="${{ github.ref_name }}"

    - name: Generate and validate theme metadata
      run: dotnet run --project tools/theme-content-generator/theme-content-generator.csproj -- --assets src/themes/wwwroot/assets --output src/themes/wwwroot/data --version-file src/themes/wwwroot/data/build-version.txt

    - name: Publish
      working-directory: ${{ github.workspace }}/src/themes/
      run: dotnet publish ./themes.csproj -c Release --no-build -o ${{ github.workspace }}/release /p:BlazorEnableCompression=false

    - name: Prepare static Pages artifact
      run: |
        touch ${{ github.workspace }}/release/wwwroot/.nojekyll

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      if: startsWith(github.ref, 'refs/tags/')
      with:
        folder: ${{ github.workspace }}/release/wwwroot
        branch: gh-pages
        clean: true
