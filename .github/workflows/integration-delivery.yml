name: Continuous Integration - Delivery

on:
  push:
    branches: [ main ]
    tags: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Generate and validate theme metadata
      run: dotnet run --project tools/theme-content-generator/theme-content-generator.csproj -- --assets src/themes/wwwroot/assets --output src/themes/wwwroot/data

    - name: Publish
      working-directory: ${{ github.workspace }}/src/themes/
      run: dotnet publish ./themes.csproj -c Release -o ${{ github.workspace }}/release /p:BlazorEnableCompression=false /p:InformationalVersion=${{ github.sha }}

    - name: Prepare static Pages artifact
      run: |
        sed -i 's/__BUILD_VERSION__/${{ github.sha }}/g' ${{ github.workspace }}/release/wwwroot/version/index.html
        sed -i 's/__DEPLOYMENT_TIMESTAMP__/'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'/g' ${{ github.workspace }}/release/wwwroot/version/index.html
        touch ${{ github.workspace }}/release/wwwroot/.nojekyll

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      if: startsWith(github.ref, 'refs/tags/')
      with:
        folder: ${{ github.workspace }}/release/wwwroot
        branch: gh-pages
        clean: true
